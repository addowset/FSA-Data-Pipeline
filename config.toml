[fhrs]
authorities_url = "https://api1-ratings.food.gov.uk/authorities/xml"
raw_dir = "raw/fhrs"
log_dir = "logs"
request_delay_seconds = 0.5
timeout_seconds = 60
max_retries = 5
backoff_factor = 2.0

[database]
path = "fsa_pipeline.db"

[companies_house]
# API key comes from the COMPANIES_HOUSE_API_KEY environment variable,
# never from this file. Auth is HTTP Basic with the key as username and
# a blank password -- verified against developer.company-information
# .service.gov.uk/authentication, not assumed.
advanced_search_url = "https://api.company-information.service.gov.uk/advanced-search/companies"
raw_dir = "raw/companies-house"
# Division 56 (food and beverage service activities), confirmed against
# Companies House's own SIC code usage, and against the brief with the
# user on 2026-08-24 (56301 "Licensed clubs" included as drink-serving,
# even though it's nightlife-adjacent rather than food service).
#
# Widened 2026-09-08 with 3 food-adjacent codes, confirmed against real
# ground-truth misses (a live sweep of the 59 UNKNOWN ground-truth rows
# against Companies House unfiltered by SIC -- see README "Design
# notes"): small food producers and specialist retailers are routinely
# registered outside the food-*service* division. Deliberately NOT
# widened to the broad retail/head-office codes (47110, 47190, 70100)
# that would catch supermarkets and franchise parents (Aldi, Lidl, Burger
# King) -- confirmed real too, but those match one giant national parent
# company to every single store, which is exactly what
# is_multi_venue_company (fsa_pipeline/classifier.py) exists to discount,
# not a reason to balloon collection scope for near-zero per-venue signal.
# - 10710: manufacture of bread, fresh pastry goods and cakes (real case:
#   "Sourdough Sophia Production Limited")
# - 47290: other retail sale of food in specialised stores
# - 46370: wholesale of coffee, tea, cocoa and spices
# Confirmed live hit counts before adding (active companies only):
# 10710=5,760, 47290=12,981, 46370=4,524 (~23,265 combined, ~9% growth on
# the existing ~260,000-company pool).
sic_codes = [
    "56101", "56102", "56103", "56210", "56290", "56301", "56302",
    "10710", "47290", "46370",
]
# Rolling trailing window re-fetched every day (like FHRS's daily bulk
# re-fetch) rather than a strict single-day cutoff, to absorb any
# indexing lag between a company's incorporation and it becoming
# searchable -- the same lesson FHRS's ExtractDate lag already taught us.
#
# This window is deliberately narrow -- it's for ONGOING daily top-ups
# only. It is NOT how the matcher's overall recall is bounded: real
# ground-truth checking (2026-08-27/28) found genuine matches missed
# because their companies were incorporated 5 months, 18 months, and 6
# years before the FHRS record appeared -- no daily window would have
# been wide enough. Fixed with a one-time full-history backfill instead
# (scripts/collect_companies_house.py --full-history, no incorporated_from
# lower bound, confirmed real scale 2026-08-28: 259,986 active hospitality
# companies nationally -- big, but ~52 pages at size=5000, trivial against
# the 600-requests-per-5-minutes rate limit). companies_current accumulates
# and never deletes, so the daily window only needs to catch what's new
# since the last run, not re-cover the whole history every day.
incorporated_window_days = 14
page_size = 500
request_delay_seconds = 0.5
timeout_seconds = 30
max_retries = 5
backoff_factor = 2.0

[diffing]
# Bulk-reupload guard for INSERT spikes. Provisional first-pass numbers,
# calibrated only against 4 real days of national data (per-authority daily
# INSERT count: median 5, max 58, p95 24 -- no actual bulk-reupload event
# has been observed yet to calibrate against). Revisit once more history
# accumulates or a real spike is seen. See fsa_pipeline/diff_engine.py.
reupload_ratio_threshold = 3.0
reupload_ratio_min_floor = 10
reupload_absolute_threshold = 150
reupload_min_history_days = 5
median_window_days = 28

[matching]
# Companies sharing a registered-office address with this many or more
# other companies are flagged as a likely formation-agent/accountant
# address (never used to gate matching itself -- see matcher.py -- only
# stored as evidence for stage 5). Grounded in real data (2026-08-24):
# median address sharing is 1 company, but 71-75 Shelton Street WC2H 9JQ
# (a known company-formation address) hosts 31 of our 1,993 companies,
# and 3 addresses host 10+. 5 sits clearly above the normal case.
high_density_address_threshold = 5
# How many ranked candidates to store as evidence per FHRS INSERT event.
candidates_per_match = 5
# National name-match channel (2026-08-28), independent of postcode
# district -- catches a company registered via a formation agent in a
# different district to where it actually trades (confirmed real case:
# "Soul Mama Islington" traded from N1, registered via a formation agent
# at 71-75 Shelton Street, WC2H -- invisible to district-only search no
# matter how good the name match). Needs a much stricter floor than the
# district-scoped search since there's no geographic corroboration behind
# it, and the candidate pool is much larger post-backfill (~260K
# companies nationally vs ~2K before) so coincidental collisions are more
# likely. User's call, 2026-08-28, adjustable once real output is seen.
national_match_threshold = 0.9

[postcode_backfill]
# Live FHRS Establishments API, used only to recover postcodes missing
# from the bulk XML -- confirmed 2026-08-25/26 against real data that
# 17.10% of establishments nationally (104,798 of 612,974) have no
# postcode in bulk, unrelated to authority staleness (West Lindsey is
# 100% missing despite not being stale at all), and that the live API
# only partially recovers this (0% improvement for West Lindsey specifically,
# 6-15% for other tested authorities) -- some gaps are missing at the
# source and no access method fixes them. See README "Design notes".
establishments_url = "https://api.ratings.food.gov.uk/Establishments"
raw_dir = "raw/fhrs-live"
page_size = 5000
request_delay_seconds = 0.5
timeout_seconds = 30
max_retries = 5
backoff_factor = 2.0
# An establishment already checked and still unresolved isn't rechecked
# again until this many days have passed -- avoids hammering the API
# daily for gaps that are very unlikely to have changed since yesterday.
recheck_after_days = 30

[classification]
# Thresholds for treating a matcher candidate (fsa_pipeline/matcher.py)
# as NEW_VENUE evidence. Grounded in real data (2026-08-27): among 645
# INSERT events with a same-district candidate, median score is 0.27
# (mostly coincidental), but 24 score >=0.5, 10 >=0.6, 5 >=0.9, 4 at
# exactly 1.0 -- a real signal concentrated at the top, noise below.
# Below new_venue_medium_threshold, a candidate isn't used for NEW_VENUE
# at all (falls through to UNKNOWN) -- too weak to be worth more than
# raw evidence in the audit trail.
new_venue_high_threshold = 0.85
new_venue_medium_threshold = 0.6
# A matched company only counts as NEW_VENUE-worthy evidence of an
# actually-new business if it was incorporated within this many days of
# the FHRS record's first_seen_date. Without this, widening Companies
# House collection to full history (2026-08-28, see [companies_house])
# would let an 18-month-old company (real case: "Mamma Rosa London")
# get labelled NEW_VENUE just for having no FHRS predecessor. User's
# reasoning, 2026-08-28: someone can incorporate a company well before
# actually opening -- "could easily be a year" -- 180 days chosen as a
# deliberately generous floor, not a tight one.
new_venue_max_incorporation_age_days = 180
# Address-history fallback (fsa_pipeline/classifier.py) when
# address_line_1 is missing on either side of a potential predecessor
# match -- falls back to postcode + this name-similarity floor instead
# of the normal exact-address match. Real case that motivated this: two
# "Rassau Fish Bar" FHRSIDs at the identical postcode, genuinely
# sequential (no overlap), missed entirely because the newer record's
# address_line_1 was null. Kept strict (near-exact) because a single
# postcode can host many unrelated venues (confirmed: one Belfast
# postcode hosts 11), so postcode alone isn't enough evidence.
address_history_fallback_threshold = 0.9

# A company already confidently matched (>= new_venue_medium_threshold) to
# this many distinct FHRS venues nationally is treated as a chain/large-
# operator match, not venue-specific corroboration -- discounts confidence
# the same way is_high_density_address does for a formation-agent address,
# just on the name axis instead. Added 2026-09-08 alongside investigating
# widening Companies House SIC scope: "ALDI STORES LIMITED" or a national
# franchise's operating company would otherwise match every single new
# store nationally with the same "corroborating" evidence, which proves
# nothing about any one specific venue. Same default as
# high_density_address_threshold -- not yet calibrated against a real
# multi-venue-company event (no SIC widening has run yet), revisit once
# one occurs.
multi_venue_company_threshold = 5

[contact]
# Used in the User-Agent header sent with every request, per FSA's request
# for an honest, identifiable client. Not a secret.
email = "andydowsett@hotmail.com"
